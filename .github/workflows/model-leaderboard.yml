name: Model Leaderboard

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score candidates
        run: python scripts/score-model-leaderboard.py
      - name: Detect leapfrog
        id: leap
        run: |
          python - <<'PY'
          import json, pathlib, os
          data = json.loads(pathlib.Path("models/leaderboard.json").read_text())
          leaps = data.get("leapfrog_candidates") or []
          print(f"leaps={','.join(leaps)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"has_leap={'true' if leaps else 'false'}\n")
              f.write(f"leaps={','.join(leaps)}\n")
          PY
      - name: Commit leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/LEADERBOARD.md models/leaderboard.json
          git diff --staged --quiet || git commit -m "chore(models): refresh embedder leaderboard"
          git push
      - name: Open leapfrog issue
        if: steps.leap.outputs.has_leap == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const leaps = '${{ steps.leap.outputs.leaps }}';
            const title = `Model leapfrog candidate(s): ${leaps}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'model-leapfrog'
            });
            if (issues.data.some(i => i.title === title)) {
              console.log('Issue already open');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['model-leapfrog'],
              body: `Automated leaderboard detected challenger(s) ≥ +1.0 NDCG vs pinned model.\n\nCandidates: **${leaps}**\n\nIf this persists for 2 consecutive weeks, consider a human-approved pin change in \`models/MANIFEST.json\`.\n\nSee \`models/LEADERBOARD.md\`.`
            });
